name: Build Windows executable

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional existing draft release tag to receive the verified EXE
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        language: [zh, en]
        include:
          - language: zh
            executable: SerialProtocolAssistant-ZH-CN.exe
          - language: en
            executable: SerialProtocolAssistant-EN.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install -r app/requirements.txt
      - name: Run protocol tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build and run packaged Qt self-test
        shell: powershell
        run: .\build_serial_console.ps1 -PythonPath python -Language ${{ matrix.language }}
      - uses: actions/upload-artifact@v4
        with:
          name: SerialProtocolAssistant-windows-x64-${{ matrix.language }}
          path: dist/${{ matrix.executable }}
          if-no-files-found: error
      - name: Upload verified executable to draft release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" "dist/${{ matrix.executable }}" --clobber
